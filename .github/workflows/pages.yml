# Builds the site and publishes dist/ to GitHub Pages.
#
# Runs on push, and on a schedule so the live news wire stays current.
#
# A note on the schedule: cron here is best-effort. GitHub does not guarantee
# scheduled runs fire on time and commonly delays them under load, so treat
# */10 as "roughly every ten minutes", not a hard interval. The page always
# shows when it was last refreshed, so a late run is visible rather than
# silently stale.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/arvandsport-animated-rebuild-863sjk]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pull the latest headlines. The fetcher skips any source that fails and
      # leaves the committed feed in place if every source is unreachable, so a
      # bad feed can never fail the deploy.
      - run: npm run news
        continue-on-error: true
      # The build itself has no dependencies; it only reads content/ and src/.
      # BASE_PATH is the Pages project-site prefix and is used only to keep
      # 404.html styled: the host serves it at an unknown depth, so unlike
      # every other page it cannot use relative asset paths.
      - run: npm run build
        env:
          BASE_PATH: ${{ github.event.repository.name }}

      # The WebGL experience is a separate Next.js app with its own
      # dependencies, statically exported into dist/experience/. It is cached
      # on a hash of its own sources: this workflow also runs on a ten-minute
      # cron for the news wire, and reinstalling three, R3F and Next to
      # reproduce a byte-identical export every ten minutes is a waste of
      # everyone's CI minutes. A cache hit skips both the install and the
      # build; any change to the app misses the key and rebuilds.
      - id: experience-cache
        uses: actions/cache@v4
        with:
          path: experience/out
          key: experience-${{ hashFiles('experience/app/**', 'experience/components/**', 'experience/lib/**', 'experience/public/**', 'experience/package-lock.json', 'experience/next.config.ts') }}
      - if: steps.experience-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: experience
      - if: steps.experience-cache.outputs.cache-hit != 'true'
        run: npm run build
        working-directory: experience
        env:
          BASE_PATH: ${{ github.event.repository.name }}
      - run: cp -r experience/out dist/experience

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
