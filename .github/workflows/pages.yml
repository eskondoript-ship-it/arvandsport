# Publishes dist/ to GitHub Pages.
#
# Set Settings → Pages → Source to "GitHub Actions" for this to take over.
# While the source is a branch, Pages serves the repository root through Jekyll
# and renders README.md instead of the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/arvandsport-animated-rebuild-863sjk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The build has no dependencies; it only reads content/ and src/.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
